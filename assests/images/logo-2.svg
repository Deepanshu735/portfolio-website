<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="100%" height="100%" fill="#e9e9e9"></rect>

  <!-- Mouse Icon -->
  <g transform="translate(335,90)">
    <rect x="0" y="0" rx="35" ry="35" width="70" height="100" fill="#5c6b8a" stroke="#2c3e66" stroke-width="4"></rect>
    
    <!-- Scroll line -->
    <line x1="35" y1="15" x2="35" y2="40" stroke="#2c3e66" stroke-width="4" stroke-linecap="round"></line>
    
    <!-- Click lines -->
    <line x1="15" y1="0" x2="15" y2="-10" stroke="#2c3e66" stroke-width="3" stroke-linecap="round"></line>
    <line x1="55" y1="0" x2="55" y2="-10" stroke="#2c3e66" stroke-width="3" stroke-linecap="round"></line>
  </g>

  <!-- Name -->
  <text x="350" y="260" text-anchor="middle" font-size="70" font-family="Poppins, Arial, sans-serif" font-weight="700" fill="#1e2f55">
        Deepanshu
  </text>

  <!-- Subtitle -->
  <text x="350" y="315" text-anchor="middle" font-size="28" font-family="Poppins, Arial, sans-serif" letter-spacing="3" fill="#2c3e66">
        Software Engineer
  </text>

</svg>
